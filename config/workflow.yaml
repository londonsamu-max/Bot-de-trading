# Flujo: correos de clientes -> confirmación de asistencia -> envío del trabajo
# Los valores ${VAR} se leen del archivo .env

general:
  empresa: "JB Renovate"
  contacto: "Workorder@jbrenovate.com"
  intervalo_segundos: 300      # cada cuánto se revisa la bandeja (5 min)
  codigo_pais: "+1"            # se antepone a los teléfonos sin prefijo

  # Las convocatorias llegan al celular personal de la gente, así que solo salen
  # dentro de este horario. Las órdenes de trabajo (a quien ya dijo que sí) y las
  # alertas al supervisor NO se retienen nunca.
  # Basado en el horario publicado en jbrenovate.com (lun-vie 9:00-17:00),
  # ampliado porque las cuadrillas arrancan antes que la oficina.
  horario_envios:
    activo: true
    inicio: "08:00"
    fin: "19:00"
    dias: [1, 2, 3, 4, 5]       # 1=lunes ... 7=domingo
    zona_horaria: "America/New_York"   # <-- AJUSTA ESTO a tu zona real

rutas:
  inventario: "data/inventario.csv"
  trabajadores: "data/trabajadores.csv"
  propiedades: "data/propiedades.csv"   # empresas de gestión y complejos
  unidades: "data/unidades.csv"         # tamaño de cada apartamento (1+1, 3+2)
  consumos: "data/consumos.csv"         # material por servicio y tamaño
  estado: "data/workflow_state.json"
  whatsapp_inbox: "data/whatsapp_inbox.jsonl"
  exportacion: "data/control_trabajos.csv"

email:
  # Google Workspace: imap.gmail.com / smtp.gmail.com (usa contraseña de aplicación)
  # Microsoft 365:    outlook.office365.com / smtp.office365.com
  imap_host: ${IMAP_HOST}
  imap_port: 993
  smtp_host: ${SMTP_HOST}
  smtp_port: 587
  smtp_ssl: false              # true si tu proveedor usa SSL directo en el puerto 465
  usuario: ${WORKFLOW_EMAIL_USER}
  password: ${WORKFLOW_EMAIL_PASSWORD}
  remitente_visible: "JB Renovate <Workorder@jbrenovate.com>"
  buzon: "INBOX"
  max_correos_por_ciclo: 25
  max_caracteres_cuerpo: 20000
  max_adjunto_mb: 10           # las fotos del formulario web
  max_adjuntos_por_correo: 10

whatsapp:
  # manual  -> escribe los mensajes en logs/whatsapp_pendientes.txt con enlaces wa.me
  # twilio  -> API de Twilio
  # meta    -> WhatsApp Cloud API
  proveedor: "manual"
  respaldo_email: true         # si WhatsApp falla, se manda el mismo mensaje por correo
  manual:
    archivo_pendientes: "logs/whatsapp_pendientes.txt"
  twilio:
    account_sid: ${TWILIO_ACCOUNT_SID}
    auth_token: ${TWILIO_AUTH_TOKEN}
    numero_origen: ${TWILIO_WHATSAPP_FROM}
  meta:
    phone_number_id: ${META_PHONE_NUMBER_ID}
    access_token: ${META_ACCESS_TOKEN}
    api_version: "v21.0"
    plantilla: ""              # nombre de la plantilla aprobada; vacío = texto libre
    idioma_plantilla: "es"
    verify_token: ${META_VERIFY_TOKEN}

recepcion:
  # El sitio (jbrenovate.com) no publica correo: los clientes escriben por el
  # formulario "Drop us a line!" y por Bookings, y eso llega al buzón REENVIADO
  # por GoDaddy. Esos remitentes automáticos van aquí para que no se filtren
  # como "noreply" y para sacar el cliente real del cuerpo del mensaje.
  # Revisa un correo que ya te haya llegado y ajusta la lista al remitente exacto.
  reenviadores:
    - "@godaddy.com"
    - "@secureserver.net"
    - "@email.godaddy.com"

  # Vacío = se aceptan correos de cualquier remitente.
  # Acepta direcciones completas ("cliente@ejemplo.com") o dominios ("ejemplo.com").
  # Los reenviadores de arriba pasan siempre, estén o no en esta lista.
  remitentes_permitidos: []
  remitentes_ignorados:
    - "notifications@"
    - "billing@"
  acusar_recibo: true          # responder al cliente cuando se registra su solicitud
  avisar_asignacion: true      # avisarle cuando ya hay cuadrilla asignada
  carpeta_adjuntos: "data/adjuntos"   # aquí se guardan las fotos que manda el cliente

parser:
  trabajadores_por_defecto: 1  # si el correo no dice cuántos se necesitan
  max_items: 50
  max_unidades_por_correo: 60

  # Las empresas de gestión escriben fechas al estilo de EE.UU.: 8/10/26 es el
  # 10 de agosto, no el 8 de octubre. Cámbialo a "EU" si alguna escribe d/m/a.
  formato_fecha: "US"

  # Etiquetas adicionales que usen tus clientes, además de las que ya reconoce
  etiquetas_extra:
    direccion: ["job site", "jobsite", "property"]
    items: ["lista de material", "material list"]

  # Palabras que identifican cada servicio en el renglón de la unidad.
  # Se suman a las que ya reconoce (paint, jani, carpet, tub).
  servicios_extra:
    paint: ["touch up", "touchup"]
    jani: ["make ready", "turnover"]
    carpet: ["shampoo"]

# Qué habilidad de data/trabajadores.csv se necesita para cada servicio.
servicios:
  habilidades:
    paint: ["pintura"]
    jani: ["limpieza"]
    carpet: ["alfombra"]
    tub: ["tinas"]
    otro: []

asistencia:
  recordatorio_minutos: 60     # recordatorio si no responden en 1 hora
  expiracion_horas: 4          # después de 4 horas la convocatoria expira
  margen_convocatoria: 1       # se convoca a 1 persona extra por si alguien dice NO

  # Cuántas unidades puede tomar una persona EL MISMO DÍA. Sin este tope, cuando
  # una empresa manda 6 unidades juntas se las lleva todas quien esté más cerca.
  # Si todos llegan al tope se asigna de todos modos (mejor eso que perder la
  # unidad) y queda avisado en el log.
  max_trabajos_por_dia: 2

despacho:
  reservar_inventario: true    # descuenta el material del disponible al asignar
  exigir_inventario_completo: false  # true = no manda la orden si falta material

alertas:
  email_supervisor: ${SUPERVISOR_EMAIL}
  whatsapp_supervisor: ${SUPERVISOR_WHATSAPP}

logging:
  level: "INFO"
  file: "logs/workflow.log"

# Plantillas de los mensajes. Las llaves {...} se reemplazan automáticamente:
# {job_id} {cliente} {cliente_email} {telefono_cliente} {fecha} {hora} {direccion}
# {zona} {descripcion} {materiales} {faltantes} {adjuntos} {trabajador} {cuadrilla}
# {requeridos} {confirmados} {convocados} {empresa} {contacto}
mensajes:
  convocatoria: |
    Hola {trabajador}, hay trabajo disponible.

    Folio: {job_id}
    Cliente: {cliente}
    Fecha: {fecha} {hora}
    Dirección: {direccion}

    Trabajo:
    {descripcion}

    Material que se entrega:
    {materiales}

    ¿Puedes asistir? Responde SI o NO a este mensaje.

  recordatorio: |
    Recordatorio {job_id} ({fecha} {hora} - {direccion}).
    Seguimos esperando tu respuesta: SI o NO.

  orden_trabajo: |
    CONFIRMADO - Orden de trabajo {job_id}

    Cliente: {cliente}
    Teléfono del cliente: {telefono_cliente}
    Fecha: {fecha} {hora}
    Dirección: {direccion}
    Cuadrilla: {cuadrilla}

    Trabajo a realizar:
    {descripcion}

    Material asignado:
    {materiales}

    Fotos del cliente: {adjuntos}

    Recoge el material antes de salir. Cualquier cambio avisa a {contacto}.

  acuse_cliente: |
    Hola {cliente},

    Recibimos su solicitud y quedó registrada con el folio {job_id}.
    Fecha programada: {fecha} {hora}
    Dirección: {direccion}

    Ya estamos confirmando al personal y le avisamos en cuanto quede asignado.

    Saludos,
    {empresa}

  cliente_asignado: |
    Hola {cliente},

    Su servicio {job_id} quedó asignado para {fecha} {hora}.
    Personal asignado: {cuadrilla}
    Dirección: {direccion}

    Saludos,
    {empresa}

  alerta_sin_personal: |
    ATENCIÓN: el trabajo {job_id} ({cliente}, {fecha} {hora}) no tiene personal confirmado.
    Convocados: {convocados} | Confirmados: {confirmados} de {requeridos}
    Dirección: {direccion}

    Hay que asignarlo a mano.

  alerta_inventario: |
    Faltante de material para {job_id} ({cliente}):
    {faltantes}

    El trabajo sigue en pie, pero hay que comprar o sustituir ese material.
