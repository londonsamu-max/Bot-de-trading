training:
  total_timesteps: 2_000_000
  eval_freq: 10_000
  checkpoint_freq: 50_000
  n_eval_episodes: 10

ppo:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy: "MlpPolicy"
  net_arch:
    pi: [256, 128, 64]
    vf: [256, 128, 64]

environment:
  initial_balance: 10000
  commission_per_trade: 2.0
  observation_dim: 46
  action_dim: 5  # Hold, Buy small, Buy full, Sell small, Sell full

reward_weights:
  risk_adjusted_return: 0.35
  gamma_alignment: 0.12
  vanna_alignment: 0.08
  charm_alignment: 0.05
  transaction_cost_penalty: 0.10
  drawdown_penalty: 0.20
  win_quality_bonus: 0.10

go_live_criteria:
  min_sharpe: 1.0
  max_drawdown_pct: 0.10
  min_profit_factor: 1.5
  min_win_rate: 0.45
